[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-trader"
version = "0.1.0"
description = "A股日线「未来涨跌」可验证量化规律挖掘平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
super-trader = "super_trader.cli:main"

[tool.setuptools.packages.find]
include = ["super_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
